# Tells the Portfolio repo to redeploy, so a newly pushed problem shows up
# in the site's Practice section within a few minutes.
# Needs a repository secret PORTFOLIO_TOKEN: a fine-grained personal access
# token with access to jharodiv/Portfolio and "Contents: Read and write".
name: Notify portfolio

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio deploy
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_TOKEN }}" \
            https://api.github.com/repos/jharodiv/Portfolio/dispatches \
            -d '{"event_type":"welearn-updated"}'
